<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="296" viewBox="0 0 1200 296" role="img" aria-labelledby="title description">
  <title id="title">AI Nexus collaboration, by invitation</title>
  <desc id="description">A four-step diagram: ask in one conversation, select a member, share bounded context, and approve a one-time handoff.</desc>
  <rect width="1200" height="296" rx="28" fill="#f7f4f0"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="48" y="58" fill="#756b7d" font-size="20" font-weight="650" letter-spacing="2">A CONVERSATION, NOT AN AGENT LOOP</text>
    <path d="M258 159 H336 M548 159 H626 M838 159 H916" stroke="#beb4bd" stroke-width="3" stroke-linecap="round"/>
    <path d="m328 151 10 8-10 8 m290-16 10 8-10 8 m290-16 10 8-10 8" fill="none" stroke="#beb4bd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#fffdfb" stroke="#ded6da" stroke-width="2"><rect x="42" y="107" width="216" height="104" rx="19"/><rect x="336" y="107" width="212" height="104" rx="19"/><rect x="626" y="107" width="212" height="104" rx="19"/><rect x="916" y="107" width="236" height="104" rx="19"/></g>
    <g fill="#c78e9c"><circle cx="73" cy="136" r="9"/><circle cx="367" cy="136" r="9"/><circle cx="657" cy="136" r="9"/><circle cx="947" cy="136" r="9"/></g>
    <g fill="#302d35" font-size="22" font-weight="620"><text x="60" y="178">Ask once</text><text x="354" y="178">Choose who replies</text><text x="644" y="178">Keep context</text><text x="934" y="178">Approve a handoff</text></g>
    <text x="48" y="257" fill="#766f79" font-size="20">Each extra AI call is visible and user initiated. File changes have a separate approval path.</text>
  </g>
</svg>
